<style>
:root{--bg:#fff3f6;--card:#fffafb;--ink:#5e2a40;--acc:#8c2f4b;--soft:#d8b46a;--glass:rgba(255,243,246,.82);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1420;--card:#3a1c2b;--ink:#ffe3ec;--acc:#ff8fb0;--soft:#6b3350;--glass:rgba(42,20,32,.82)}}
:root[data-theme="dark"]{--bg:#2a1420;--card:#3a1c2b;--ink:#ffe3ec;--acc:#ff8fb0;--soft:#6b3350;--glass:rgba(42,20,32,.82)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:#ffe8ef;font-family:Quicksand,system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:92vw}
.hud button,.hud a{background:var(--glass);color:var(--ink);border:1.5px solid var(--soft);border-radius:999px;padding:9px 14px;font:700 14px Quicksand,sans-serif;text-decoration:none;backdrop-filter:blur(6px)}
.hud .on{background:var(--acc);color:#fff;border-color:var(--acc)}
#js{position:fixed;left:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:110px;height:110px;border-radius:50%;background:var(--glass);border:2px solid var(--soft);touch-action:none}
#kn{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:var(--acc);opacity:.85}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);text-align:center;font-weight:700;font-size:14px;pointer-events:none;transition:opacity 1s}
#hint span{background:var(--glass);padding:7px 14px;border-radius:999px}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(255,214,228,.88);padding:18px;box-sizing:border-box;text-align:center}
.ov.show{display:flex}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .ov{background:rgba(30,12,22,.9)}}
.btn{background:var(--acc);color:#fff;border:0;border-radius:999px;padding:13px 30px;font:700 16px Quicksand,sans-serif;margin-top:18px}
h1{font:italic 600 clamp(40px,12vw,64px)/1.05 "Cormorant Garamond",Georgia,serif;margin:0 0 10px}
.pol{background:#fffaf5;padding:12px 12px 8px;border:3px solid #e88aa6;border-radius:4px;box-shadow:0 10px 30px rgba(120,40,70,.25)}
.pol img{display:block;max-width:84vw;max-height:66vh;object-fit:contain}
.pol p{margin:8px 0 2px;font:italic 600 22px "Cormorant Garamond",Georgia,serif;color:#5e2a40}
.paper{background:var(--card);max-width:520px;width:100%;max-height:78vh;overflow:auto;padding:26px 24px;border-radius:6px;border:2px solid var(--soft);text-align:left;font:500 21px/1.5 "Cormorant Garamond",Georgia,serif;white-space:pre-line;-webkit-user-select:text;user-select:text}
#song{font-size:13px;margin-top:14px;color:var(--ink)}
.hud button,.hud a{padding:7px 11px;font-size:12px}
#rot{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;flex-direction:column;background:#8c2f4b;color:#fff;font:700 20px Quicksand,sans-serif;text-align:center;padding:30px}
@media(orientation:portrait){#rot{display:flex}}
#toast{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 56px);text-align:center;pointer-events:none;opacity:0;transition:opacity .4s;font-weight:700}
#toast span{background:var(--glass);border:1.5px solid var(--soft);padding:8px 16px;border-radius:999px}
#gc{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:8px}
.gb{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:100%}
.cd{aspect-ratio:1;border-radius:8px;border:2px solid var(--soft);background:var(--acc) center/cover;color:#fff;font-size:20px;padding:0}
.ar{position:relative;width:100%;height:210px;overflow:hidden;background:var(--glass);border:2px solid var(--soft);border-radius:10px}
.gh{position:absolute;font-size:34px;transition:top 2.6s linear;cursor:pointer}
#ol{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;background:var(--glass);border:1.5px solid var(--soft);border-radius:999px;padding:6px 12px;font:700 12px Quicksand,sans-serif}
